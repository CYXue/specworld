name: 数据自动同步

# 「发布后不用人管」这台发动机的一句话说明：
# 每 12 小时抓一次官网、过闸门、把快照提交回仓库，站点内容真有变化时顺手发布到 GitHub Pages。
#
# 三个容易被忽略、但决定这条管线能不能长期无人值守的点：
#
# 1. 抓取跑在 GitHub 的境外节点上，华为与苹果官网都直连得通；从中国大陆跑则不一定。
# 2. 「数据变了才提交」靠的是内容指纹，**不是 git diff**。data/products.json 里带着
#    generatedAt / lastSeenAt / listedAt 一串运行时刻字段，每次跑都在变，用它做判据
#    等于每 12 小时制造一次空提交。指纹由 scripts/publish/fingerprint.mjs 负责剥离。
# 3. 发布日期取证表 data/release-dates.json 是人工核对的 curated 数据，必须入库。
#    它曾经躺在 _work/ 里（被 .gitignore 排除），CI 全新 checkout 拿不到，
#    60 台全部因「无发布日期」被窗口过滤丢掉 —— 同步每一次都失败。

on:
  schedule:
    # 每 12 小时一次。GitHub 的 cron 走 UTC，这里对应北京时间 09:40 与 21:40。
    # 新机发布后最快半天自己出现在站里。
    - cron: '40 1,13 * * *'
  # 手动触发（抢时效时用，整轮不到一分钟）
  workflow_dispatch:
    inputs:
      offline:
        description: '离线模式：只用缓存，上游抓取失败时的重跑方式'
        type: boolean
        default: false
      force_publish:
        description: '内容没变也重新发布站点'
        type: boolean
        default: false
  # 改动取数/规范化/前端代码时立即验证，不等 12 小时。
  # 注意：bot 提交的 data/products.json 与 data/release-dates.json 也命中下方 paths，
  # 因此 bot 的提交会再触发一轮 workflow。但那一轮管线重跑后指纹不变（指纹已剥离
  # 运行时刻字段），data_changed 为 false，提交步不会再次 git push，故不会形成死循环，
  # 只是每轮数据同步多跑一次无害的冗余 run。
  push:
    paths:
      - 'scripts/**'
      - 'data/release-dates.json'
      - 'data/products.json'
      - 'public/fonts/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'postcss.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sync.yml'

permissions:
  contents: write # 提交快照
  issues: write # 同步失败时开 issue 留痕

concurrency:
  group: specworld-sync
  cancel-in-progress: false

jobs:
  # 护栏：不联网、不碰官网，1 秒内跑完 118 项断言。
  # 放在最前面是因为它最便宜，而且失败信息最明确——解析器、闸门或渲染层几何写错了，
  # 后面那次联网抓取跑出来的也是脏数据/错页面，不如当场停。
  # 断言数以 selftest.mjs 末尾自报为准，本行只是注释，改数字时不必同步（但改了最好跟上）。
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 精灵图是构建期产物（data/sprites/ 在 .gitignore 里），全新 checkout 不存在。
      # 而「画布字段与数据对齐」等判据要读立绘 SVG —— 不补这一步，CI 上 selftest
      # 从工作流上线第一天起就必失败（缺 apple-iphone-16.svg），
      # needs: selftest 的 sync / deploy 全部被跳过 ⇒ 定时同步其实一次都没跑通过。
      # 2026-10-12 复盘 24 次历史 run 时发现：唯一的 bot 成功提交停留在 10-02，
      # 正是因为 10-02 时 sprites 还入库，10-03 重构把它移出仓库后判据就开始必挂。
      # 离线生成：只读 data/products.json，零网络零依赖，秒级；不入库（CI 用完即弃）。
      - name: 生成精灵图（离线）
        run: node scripts/sprite/generate.mjs

      # 覆盖两类东西：
      #   1. 解析器——错了不报错，只会静默产出脏值（历史上刷新率解析错过两次）
      #   2. 校验闸门本身——它是「拒绝写盘」的唯一防线，自己写错了防线就漏了
      - name: 管线自测
        run: node scripts/selftest.mjs
      # 依赖源闸门：lock 里混入镜像地址会让连不上该镜像的环境 `npm ci` 直接失败。
      # 本机 registry 指向国内镜像（装包快），所以这条几乎必然在本地被写脏——
      # 靠人记忆在推送前 sed 是不现实的，改成 push 时当场拦截。
      # 修法：npm run lock:fix（只换 URL 主机名，integrity 与结构不动）。
      - name: 依赖源检查
        run: node scripts/publish/normalize-lock.mjs

      # 规范闸门：把 CONVENTIONS.md 里能机器判的条款变成拦截。
      # 覆盖 Toy 平台硬约束（base: './' + hash 路由，改了会白屏）、
      # src/ 零调试日志、命令式 innerHTML 的 scoped 样式陷阱、lock 源纯度。
      # 主观条款（注释质量、命名贴切）不查——闸门只管能判的，避免制造噪声被整体忽略。
      - name: 规范自检
        run: node scripts/publish/check-conventions.mjs

      # 模板级类型检查（vue-tsc）：tsc --noEmit 只看 .ts，**.vue 模板里的
      # 未定义标识符/错误 prop 它一个都看不见** —— 2026-10-14 重构画布页时
      # 实测连踩两刀（删 import 删出 ref/onMounted 未定义、模板引用已删的 err），
      # tsc 全绿而页面白屏，全靠冒烟脚本兜住。类型谎言（ComputedRef cast 成
      # 数组）也是同一天被它抓出来的。这条闸门让那类回归在本地就跑红。
      - name: 模板类型检查（vue-tsc）
        run: npm run type-check

      # 字形覆盖闸门：字体缺字形时浏览器**静默**回退系统字体，零报错，
      # 症状是「同一句话里有些字像素、有些字圆滑」—— 风格不统一最隐蔽的成因。
      # 历史教训：旧字体只覆盖项目实需汉字的 45%，而所有基于样式声明的检查都是绿的。
      # 数据来自生成期落下的 public/fonts/coverage.json（含字体 sha256，防「换了字体忘重生成」）。
      # 换字体/改文案后若报缺字：python scripts/font/build-subset.py
      - name: 字形覆盖检查
        run: node scripts/publish/check-font-coverage.mjs

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: selftest
    outputs:
      data_changed: ${{ steps.fp.outputs.data_changed }}
      site_changed: ${{ steps.fp.outputs.site_changed }}
      summary: ${{ steps.fp.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      # 缓存 npm 依赖。node_modules/ 不入库，CI 每次都是全新安装；
      # package-lock.json 已锁定精确版本，命中缓存时秒级完成。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 条件请求缓存。_work/ 不入库，CI 每次 checkout 都是空的，
      # 全靠这里恢复；命中 ETag 时上游返回 304，零流量。
      - name: 恢复 HTTP 缓存
        uses: actions/cache@v4
        with:
          path: |
            _work/huawei.cache
            _work/apple.cache
            _work/apple-compare.cache
            _work/apple-prices.cache
          key: sync-http-cache-${{ github.run_id }}
          restore-keys: sync-http-cache-

      # 数据层：取数 → 规范化 → 整合闸门 → 精灵图 → 指纹。
      # --data-only 跳过旧的多页 HTML 建站（渲染已交给 Vite，见下一步）。
      # 这条链只用 Node 内置模块，不装任何依赖 —— HTML 解析是手写正则与状态机。
      # 管线内建合理性闸门：机型总数骤降、必填字段覆盖率下滑、数值超出物理区间
      # 都会拒绝写入并以非零退出码结束，此时旧快照原封不动地保留。
      - name: 跑数据管线
        run: |
          if [ "${{ inputs.offline }}" = "true" ]; then
            node scripts/pipeline.mjs --data-only --offline
          else
            node scripts/pipeline.mjs --data-only
          fi

      # 渲染层：Vite + Vue3 + TS + Tailwind。
      # npm ci 严格按 package-lock.json 装，可复现；prebuild 会把 data/ 同步进
      # public/，postbuild 跑 verify-dist.mjs —— 入口缺失/绝对路径/外链/超 50 MB
      # 任何一条不过，vite build 后的这一步就非零退出，产物不会被发布出去。
      - name: 构建站点（Vite）
        run: |
          npm ci
          npm run build

      # i18n SSR 双语冒烟：整站 13 个路由 × zh/en 双语真渲染一遍（vite SSR 管线，
      # 零网络零浏览器）。抓两类**零报错的静默故障**：
      #   ① 缺键抛错 —— src/i18n 配了 missing: throw，只有渲染期才炸得出来；
      #   ② 英文页界面残留中文 —— 抽键漏网的硬编码，静态检查看不出来。
      # 它曾在 package.json 里注册（npm run smoke:i18n）却**没有任何 CI 调用**，
      # 引入当天就是红的（router 模块实例分裂，见 scripts/smoke/ssr-deps.ts 头注），
      # 一整天无人察觉。「注册≠调用」：不接进 CI 的闸门等于不存在。
      # 位置放在构建之后：prebuild 已把 data/ 同步进 public/，冒烟从那里读数据集；
      # 放在提交/发布之前：它红就不许发布。
      - name: i18n SSR 双语冒烟
        run: node scripts/smoke/i18n-ssr.mjs

      # 从指纹结果里取判断依据。注意看的是 changed，不是 git diff。
      - name: 判断内容是否变化
        id: fp
        run: |
          node -e "
            const fs = require('fs');
            const out = process.env.GITHUB_OUTPUT;
            const fp = JSON.parse(fs.readFileSync('_work/fingerprint.json', 'utf8'));
            const s = fp.stats || {};
            const brands = Object.entries(s.byBrand || {}).map(([k,v]) => k + ' ' + v).join(' / ');
            const summary = s.products + ' 台（' + brands + '）';
            const lines = [
              'data_changed=' + fp.changed.data,
              'site_changed=' + fp.changed.site,
              'data_fingerprint=' + fp.dataFingerprint,
              'site_fingerprint=' + fp.siteFingerprint,
              'summary=' + summary,
            ].join('\n') + '\n';
            fs.appendFileSync(out, lines);
            console.log(lines);
          "

      # 只提交 data/（唯一数据源）。dist/ 与 _work/ 都在 .gitignore 里，
      # 站点产物任何人都能用 `node scripts/pipeline.mjs --data-only && npm ci && npm run build` 重新生成。
      # public/data 与 public/sprites 是构建期从 data/ 同步的拷贝，同样不入库 ——
      # 入库两份必然出现「改了 data/ 忘了重新 build」的版本漂移。
      # 这与参考项目一致：仓库存数据与代码，产物不入库。
      #
      # 触发条件是「数据变了 **或** 站点变了 **或** 待收录队列变了」，不是只看数据：
      #   1. 只改了前端（src/**）时数据内容没变，但站点变了 —— 若不推进指纹指针，
      #      之后每一轮都会被判成「站点有变化」，于是每 12 小时重复发布一次同样的站点。
      #   2. **队列变了但台数没变**：新机发布却缺发布日期时，它进不了 products.json，
      #      数据指纹不动、站点指纹也不动。此时若不在触发条件里带上队列，
      #      data/discovery-pending.json 就永远提交不进仓库 —— 队列等于没有。
      #      这正是「安静地丢了一台新机」最难发现的一种形态。
      #   3. **归档变了但页面没变**：官网把某个章节标题改了个字，而那个字段
      #      恰好没进 products.json。这时两个指纹都不动，但 data/raw/ 必须更新 ——
      #      否则它记的是上一个版本的官网，回放验证就成了自欺欺人。
      - name: 提交变化
        if: >-
          steps.fp.outputs.data_changed == 'true' ||
          steps.fp.outputs.site_changed == 'true' ||
          steps.fp.outputs.pending_changed == 'true' ||
          steps.fp.outputs.raw_changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 把指针推进到这一版
          node scripts/publish/fingerprint.mjs --write-pointer
          if [ "${{ steps.fp.outputs.data_changed }}" = "true" ]; then
            git add -A -- data/
          elif [ "${{ steps.fp.outputs.pending_changed }}" = "true" ]; then
            # 队列变了但快照没变（新机缺发布日期）：只带队列、归档与指针。
            # 快照不带进来，是因为它这次一个字都没动。
            # 归档必须一起带：新机进队列的那一刻官网页面必然也变了，两者几乎总是同时发生。
            # 早先这里漏了 data/raw —— elif 链是互斥的，raw 分支永远等不到「队列没变」的机会，
            # 于是每次有新机待收录，归档就静默地不更新，回放验证逐渐失真。
            git add -- data/discovery-pending.json data/raw data/.fingerprint
          elif [ "${{ steps.fp.outputs.raw_changed }}" = "true" ]; then
            # 归档变了但快照没变（官网改了章节标题，而该字段没进快照）：
            # 只带归档与指针。同样不带快照 —— 它这次一个字都没动。
            git add -- data/raw data/.fingerprint
          else
            # 数据内容没变（只是前端或取数代码变了）：只提交指纹指针。
            # 快照不带进来，是因为它唯一的变化是那串运行时刻字段。
            git add -- data/.fingerprint
          fi
          # 显式 pathspec 之后再拦一道：只许 data/ 下的文件入库，
          # 避免 _work/ 里的原始响应被误提交
          if git diff --cached --name-only | grep -Ev '^data/'; then
            echo "::error::暂存区出现了 data/ 以外的文件，拒绝提交"
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "chore(data): 自动同步 — ${{ steps.fp.outputs.summary }}" \
                     -m "数据指纹 ${{ steps.fp.outputs.data_fingerprint }} · 站点指纹 ${{ steps.fp.outputs.site_fingerprint }}"
          git push

      # 站点产物交给下一个 job 发布。同一次运行内传递，不重复抓官网。
      # dist/ 是 Vite 的产物（单个 index.html + assets/），不是多页 HTML。
      - name: 上传站点产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

      # 闸门拦截时留下证据，方便回溯是哪一次上游出了问题
      - name: 上传同步报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: |
            _work/sync-report.json
            _work/fingerprint.json
            dist/manifest.json
          retention-days: 30
          if-no-files-found: ignore

      # 「零维护」承诺失效时必须留下一条看得见的痕迹。
      # 找标题为「数据同步失败」且仍 open 的 issue：有就追加评论，没有就新建——
      # 连续失败不会刷出一堆 issue，修好之后手动关掉那一条即可。
      - name: 同步失败时开 issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '数据同步失败';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let summary = '本次运行没有产出 _work/sync-report.json，多半是管线在校验之前就异常终止了，请直接看运行日志。';
            try {
              const r = JSON.parse(fs.readFileSync('_work/sync-report.json', 'utf8'));
              summary = [
                `- 收录 ${r.kept ?? '?'} 台，丢弃 ${(r.dropped ?? []).length} 台`,
                '',
                `**校验失败（${(r.failures ?? []).length}）**`,
                ...((r.failures ?? []).length ? r.failures.map((f) => `- ${f}`) : ['- （无）']),
                '',
                `**注意（${(r.notes ?? []).length}）**`,
                ...((r.notes ?? []).length ? r.notes.slice(0, 10).map((n) => `- ${n}`) : ['- （无）']),
                '',
                '**字段覆盖率**',
                ...(r.coverage ?? []).map((c) => `- ${c}`),
              ].join('\n');
            } catch (err) {
              summary += `\n\n（读取报告时出错：${String(err)}）`;
            }

            const body = [
              `### 同步失败 · ${new Date().toISOString()}`,
              '',
              `运行链接：${runUrl}`,
              '',
              summary,
              '',
              '常见的三类原因：官网改版导致取数解析失败、闸门判定数据不合理（此时旧快照会被完整保留）、发布日期取证表缺失。',
              '完整的 sync-report.json 在该次运行的 artifact `sync-report` 里。',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`已在 issue #${existing.number} 追加评论`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  '数据同步管线（`.github/workflows/sync.yml`）运行失败。',
                  '每次失败都会在这条 issue 下追加一条评论；问题修复、同步恢复后请手动关闭。',
                  '',
                  body,
                ].join('\n'),
              });
              core.info(`已新建 issue #${created.number}`);
            }

  # 发布到 GitHub Pages。零凭据：不需要配任何 Secret，
  # 只要在仓库 Settings → Pages 把 Source 切成 GitHub Actions。
  #
  # 只在「用户看得见的东西变了」时才发 —— 判据是站点指纹（数据 × 模板）。
  # 数据没变、模板没变，就不发，哪怕时间戳已经刷新过一轮。
  deploy:
    needs: [sync, selftest]
    # 定时任务没有 inputs，这时 github.event.inputs 为空串，整体等价于只看 site_changed
    if: ${{ needs.sync.outputs.site_changed == 'true' || github.event.inputs.force_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # Pages 默认走 Jekyll，会把下划线开头的目录与文件吃掉。产物里没有，
      # 但加这个文件是零成本的保险。
      - name: 关闭 Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<!--
  Toy 封面（poster）源文件 —— 960×540（16:9），由 make-toy-assets.mjs 栅格化成 PNG。

  像素风纪律（CONVENTIONS.md §2.5.1）：零圆角 / 零模糊 / 零渐变 / 字号 12 整数倍。
  SpecPixel 是 12px 字体，这里只取 24/48/60 三档，保证字形不被缩放糊掉。
  太极图直接 NEAREST 放大 public/favicon.svg —— 它就是本站的视觉标识，
  像素块必须硬，一放大就糊等于自己砸自己的美学。
  改这张页面 = 改封面；改完重跑 node scripts/publish/make-toy-assets.mjs。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>参数世界 · Toy 封面</title>
<style>
  @font-face {
    font-family: 'SpecPixel';
    src: url('../../../public/fonts/pixel-zh.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 960px; height: 540px; overflow: hidden; }
  body {
    background: #f5f5f7;
    font-family: 'SpecPixel', monospace;
    color: #111114;
    -webkit-font-smoothing: none;
    position: relative;
  }
  /* 四角像素装饰：8px 实心方块，顶左/底右各一，呼应 favicon 的黑白语言 */
  .corner { position: absolute; width: 8px; height: 8px; background: #111114; }
  .corner.tl { top: 24px; left: 24px; }
  .corner.tr { top: 24px; right: 24px; background: #f5f5f7; border: 8px solid #111114; }
  .corner.bl { bottom: 60px; left: 24px; background: #f5f5f7; border: 8px solid #111114; }
  .corner.br { bottom: 60px; right: 24px; }

  .stage { position: absolute; inset: 0; display: flex; align-items: center; }

  /* 左：太极标识，NEAREST 放大保像素硬边 */
  .mark {
    width: 192px; height: 192px;
    margin-left: 88px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    flex: none;
  }

  /* 右：文字区（中英双语：站名与 slogan 各出一条，英文用同一 SpecPixel，
     52/52 拉丁字形全覆盖，不会静默回退系统字体） */
  .copy { margin-left: 64px; }
  .title { font-size: 60px; line-height: 1.2; letter-spacing: 4px; }
  .title-en { font-size: 24px; line-height: 1.5; letter-spacing: 6px; color: #3c3d44; margin-top: 12px; }
  .rule { width: 96px; height: 12px; background: #111114; margin: 24px 0; }
  .slogan { font-size: 24px; line-height: 1.5; letter-spacing: 2px; }
  .sub { font-size: 24px; line-height: 1.5; letter-spacing: 2px; margin-top: 12px; }

  /* 底：通栏黑带 */
  .band {
    position: absolute; left: 0; right: 0; bottom: 0; height: 36px;
    background: #111114; color: #f5f5f7;
    font-size: 12px; letter-spacing: 3px; line-height: 36px;
    padding: 0 24px;
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>

  <div class="stage">
    <img class="mark" src="../../../public/favicon.svg" alt="参数世界">
    <div class="copy">
      <div class="title">参数世界</div>
      <div class="title-en">PARAMETER WORLD</div>
      <div class="rule"></div>
      <div class="slogan">选择更清楚 · Choose with Clarity</div>
      <div class="sub">量化参数可对比</div>
    </div>
  </div>

  <div class="band">
    <span>选择更清楚 · CHOOSE WITH CLARITY</span>
    <span>SPECWORLD · BILIBILI TOY</span>
  </div>
</body>
</html>

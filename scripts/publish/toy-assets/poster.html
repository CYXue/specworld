<!DOCTYPE html>
<!--
  Toy 封面（poster）源文件 —— 960×720（4:3），由 make-toy-assets.mjs 栅格化成 PNG。

  为什么是 4:3 而不是 16:9
  ------------------------
  B 站 Toy 的 doctor 预检明确偏好 4:3 横版封面（COVER_RATIO = 4/3，容差 0.08）：
  偏差超了会 warn「portrait/异形封面在 Toy 卡片里可能裁切不佳」。
  第一版做过 960×540（16:9），偏差 0.44 远超容差 —— 而且更坑的是，
  toy-create.mjs 跑 doctor 时没传 --poster，这条校验被静默跳过、零 findings 是假象。
  2026-10-12 改为 4:3 并把 --poster 补上。

  构图：上下结构（标识居上 → 标题组 → 通栏黑带压底）。
  4:3 比 16:9 高 180px，横排会出现大片死空；上下结构在卡片缩略图里标题更大。
  太极图直接 NEAREST 放大 public/favicon.svg —— 它就是本站的视觉标识。

  字体（2026-10-17 更新）
  ----------------------
  全站 2026-10-15 去像素化后改用系统字体栈（src/style.css 的 --font-sans），
  像素字体 SpecPixel / public/fonts/ 全部退役。本封面同步跟进：
  原先 @font-face 引用已删除的 pixel-zh.woff2，症状是**静默回退**到系统字形
  （截图照样出、肉眼不放大看不出来）——本项目最忌讳的故障样式，故整体换栈。
  字号不再受「12 整数倍」的像素纪律约束，按封面视觉权重取 24/64 两档。

  改这张页面 = 改封面；改完重跑 node scripts/publish/make-toy-assets.mjs --force。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>参数世界 · Toy 封面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 960px; height: 720px; overflow: hidden; }
  body {
    background: #f5f5f7;
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
      'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
      sans-serif;
    color: #111114;
    position: relative;
  }

  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }

  /* 太极标识，NEAREST 放大保硬边 */
  .mark {
    width: 224px; height: 224px;
    margin-top: 64px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    flex: none;
  }

  /* 标题组：中英双语，同一套系统栈（拉丁与中文都不回退到第二种字体） */
  .title { font-size: 64px; font-weight: 700; letter-spacing: 6px; margin-top: 44px; }
  .title-en { font-size: 22px; font-weight: 500; letter-spacing: 6px; color: #3c3d44; margin-top: 14px; }
  .rule { width: 96px; height: 4px; background: #111114; border-radius: 2px; margin: 30px 0; }
  .slogan { font-size: 24px; font-weight: 500; letter-spacing: 2px; }
  .sub { font-size: 20px; letter-spacing: 2px; color: #3c3d44; margin-top: 12px; }

  /* 底：通栏黑带 */
  .band {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
    background: #111114; color: #f5f5f7;
    font-size: 13px; letter-spacing: 3px; line-height: 44px;
    padding: 0 32px;
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="mark" src="../../../public/favicon.svg" alt="参数世界">
    <div class="title">参数世界</div>
    <div class="title-en">PARAMETER WORLD</div>
    <div class="rule"></div>
    <div class="slogan">选择更清楚 · Choose with Clarity</div>
    <div class="sub">量化参数可对比</div>
  </div>

  <div class="band">
    <span>选择更清楚 · CHOOSE WITH CLARITY</span>
    <span>SPECWORLD · BILIBILI TOY</span>
  </div>
</body>
</html>
